<g fill="none" stroke-width="4"><path d="M885 309L1092 229" stroke="#b57732" marker-end="url(#g)"/><path d="M885 309L1055 382" stroke="#0d7b82" marker-end="url(#t)"/><path d="M885 309V482" stroke="#b34a45" marker-end="url(#r)"/></g><circle cx="885" cy="309" r="7" fill="#091b2b"/><text x="1030" y="203" font-size="19" fill="#b57732">x: forward</text><text x="995" y="416" font-size="19" fill="#0d7b82">y: right wing</text><text x="903" y="482" font-size="19" fill="#b34a45">z: down</text><text x="661" y="120" font-size="17">X, Y, Z: total body-axis force components</text><text x="661" y="149" font-size="17">ℓ, M, N: roll, pitch and yaw moments</text><text x="661" y="178" font-size="17">p, q, r: angular rates about x, y and z</text><text x="650" y="529" font-size="19">m(v̇ + ω × v) = F</text><text x="650" y="564" font-size="19">Iω̇ + ω × (Iω) = [ℓ, M, N]ᵀ</text><text x="650" y="603" font-size="13">Right-handed body axes; positive moments follow the right-hand rule.</text><text x="650" y="625" font-size="13">Body-axis velocity is inertial velocity resolved in the rotating frame.</text></g></svg>